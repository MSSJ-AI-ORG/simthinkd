name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[train]" --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Package tests
        run: python -X utf8 tests/test_package.py
      - name: Factory twin end-to-end
        run: python -X utf8 tests/test_factory_twin.py
      - name: Score model
        run: python -X utf8 tests/test_score.py
      - name: Parallel questions and batch inference
        run: python -X utf8 tests/test_parallel.py
      - name: Server latency (keep-alive)
        run: python -X utf8 tests/test_server_latency.py
      - name: Router kit
        run: python -X utf8 tests/test_router.py
      - name: Router kit DOM input
        run: python -X utf8 tests/test_dom_adapter.py
      - name: Router kit example (sealed PREREG, reproducible twice)
        run: python -X utf8 tests/test_router_example.py
      - name: Screen actions (0.5.0)
        run: python -X utf8 tests/test_screen_actions.py
      - name: Screen benchmark, offline checks (no Chrome)
        run: |
          pip install pytest pillow websocket-client
          python -X utf8 -m pytest -q benchmarks/screen/test_bench_offline.py
